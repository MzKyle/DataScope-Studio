name: Quality

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: quality-${{ github.ref }}
  cancel-in-progress: true

jobs:
  storage-compatibility:
    name: CSV storage compatibility (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
      - name: Install Python dependencies
        run: python -m pip install -r requirements-dev.txt
      - name: Verify v5 migration, exact aggregates and build lifecycle
        run: >-
          python -m pytest -q
          tests/unit/test_database_migrations.py
          tests/unit/test_query_aggregate.py
          tests/unit/test_time_utils.py
          tests/unit/test_typed_query_storage.py
          tests/unit/test_query_backends.py
          tests/unit/test_storage_modes.py
          tests/unit/test_jobs.py
          tests/unit/test_job_executor.py
          tests/integration/test_typed_storage_workflows.py
          tests/integration/test_quick_inspect.py
  pr-gates:
    name: PR quality gates
    runs-on: ubuntu-22.04

    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: "20.20.1"
          cache: npm
          cache-dependency-path: apps/desktop/package-lock.json

      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - uses: dtolnay/rust-toolchain@stable

      - name: Install Tauri system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            pkg-config \
            build-essential \
            libgtk-3-dev \
            libwebkit2gtk-4.1-dev \
            libjavascriptcoregtk-4.1-dev \
            libsoup-3.0-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            libxdo-dev \
            libssl-dev

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-dev.txt

      - name: Run strict PR acceptance gates
        run: |
          python packaging/release/strict_acceptance.py \
            --profile pr \
            --install-desktop-deps
